<style>
/* ============================================================
   SCOPED STYLES — all prefixed .ss- to avoid theme conflicts
   ============================================================ */
#stroke-sim-root, #stroke-sim-root * { box-sizing: border-box; }
#stroke-sim-root {
  font-family: 'DM Sans', system-ui, sans-serif;
  color: #e2e8f0;
  background: radial-gradient(circle at 20% 0%, #1e293b 0%, #0a0e14 50%, #050810 100%);
  min-height: 100vh;
  width: 100%;
  margin: 0;
  padding: 0;
  line-height: 1.5;
  font-size: 14px;
}
#stroke-sim-root button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}
#stroke-sim-root ul { margin: 0; padding-left: 18px; }
#stroke-sim-root h1, #stroke-sim-root h2, #stroke-sim-root h3 { margin: 0; }
#stroke-sim-root p { margin: 0; }
#stroke-sim-root svg { display: block; }

.ss-display { font-family: 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.02em; }
.ss-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
.ss-container { max-width: 640px; margin: 0 auto; padding: 16px; }
.ss-screen { padding: 20px 0; }

/* Status Bar */
.ss-statusbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid rgba(148,163,184,0.1);
  position: sticky; top: 0; z-index: 10;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.ss-statusbar .ss-case-num { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b; }
.ss-statusbar .ss-score { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #f59e0b; font-weight: 600; }

/* Cards */
.ss-card {
  background: rgba(15,23,42,0.7);
  border: 1px solid rgba(148,163,184,0.15);
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 12px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.ss-card.ss-accent-amber { border-color: rgba(245,158,11,0.3); }
.ss-card.ss-accent-cyan { border-color: rgba(6,182,212,0.3); }
.ss-card.ss-accent-red { border-color: rgba(239,68,68,0.4); }
.ss-card.ss-accent-green { border-color: rgba(16,185,129,0.4); }

/* Section Label */
.ss-section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.18em;
  color: #64748b;
  font-weight: 600;
  text-transform: uppercase;
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 8px;
}

/* Pills */
.ss-pill {
  font-family: 'JetBrains Mono', monospace;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 11px; font-weight: 600;
  letter-spacing: 0.05em; text-transform: uppercase;
}

/* Buttons */
.ss-btn {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  width: 100%;
  padding: 13px 18px;
  border-radius: 10px;
  font-weight: 600; font-size: 15px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  letter-spacing: -0.01em;
  transition: transform 0.1s ease, opacity 0.2s ease;
  border: 1.5px solid;
}
.ss-btn:active { transform: scale(0.98); }
.ss-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ss-btn-primary { background: #f59e0b; color: #0a0e14; border-color: #f59e0b; }
.ss-btn-ghost { background: transparent; color: #e2e8f0; border-color: rgba(148,163,184,0.3); }
.ss-btn-info { background: #06b6d4; color: #0a0e14; border-color: #06b6d4; }
.ss-btn-success { background: #10b981; color: #0a0e14; border-color: #10b981; }

/* Hero / Intro */
.ss-hero-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 72px; height: 72px;
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 0 40px rgba(245,158,11,0.3);
}
.ss-hero-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 32px; font-weight: 700;
  line-height: 1.1;
  background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.03em;
}
.ss-hero-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: #64748b;
  letter-spacing: 0.2em; margin-top: 12px;
  text-transform: uppercase;
}

/* Provider Picker */
.ss-provider-btn {
  width: 100%;
  display: flex; align-items: center; gap: 14px;
  padding: 16px;
  margin-bottom: 10px;
  background: rgba(15,23,42,0.7);
  border-radius: 12px;
  text-align: left;
  color: #e2e8f0;
  transition: all 0.15s ease;
  border: 1.5px solid;
}
.ss-provider-btn:hover { transform: translateX(2px); }
.ss-provider-badge {
  font-family: 'JetBrains Mono', monospace;
  width: 40px; height: 40px;
  border-radius: 10px;
  color: #0a0e14;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 18px;
}
.ss-provider-name { font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 600; }
.ss-provider-scope { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #64748b; letter-spacing: 0.05em; margin-top: 2px; }

/* Dispatch */
.ss-dispatch-box {
  background: linear-gradient(180deg, rgba(6,182,212,0.15), transparent);
  border: 1px solid rgba(6,182,212,0.3);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 20px;
}
.ss-pulse-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #06b6d4;
  box-shadow: 0 0 12px #06b6d4;
  animation: ss-pulse 1.5s ease-in-out infinite;
}
@keyframes ss-pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
.ss-dispatch-title {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 20px; font-weight: 600;
  margin: 14px 0 16px;
  line-height: 1.3;
}
.ss-info-row {
  display: flex; align-items: flex-start; gap: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  margin-bottom: 10px;
}
.ss-info-label {
  min-width: 70px;
  color: #64748b;
  font-size: 10px;
  letter-spacing: 0.1em;
  padding-top: 2px;
}
.ss-info-value { color: #e2e8f0; flex: 1; }

/* Primary Survey */
.ss-survey-row {
  display: flex; align-items: center; gap: 10px;
  font-size: 13px; margin-bottom: 8px;
}
.ss-survey-letter {
  font-family: 'JetBrains Mono', monospace;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: rgba(245,158,11,0.15);
  color: #f59e0b;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px;
}

/* Vitals */
.ss-vital {
  padding: 10px 12px;
  background: rgba(0,0,0,0.3);
  border-radius: 8px;
  border: 1px solid rgba(148,163,184,0.1);
}
.ss-vital-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: #64748b; letter-spacing: 0.15em; }
.ss-vital-value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; color: #e2e8f0; margin-top: 2px; }
.ss-vitals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Time Windows */
.ss-time-windows { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.ss-time-window {
  font-family: 'JetBrains Mono', monospace;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.05em;
  background: rgba(148,163,184,0.1);
  color: #64748b;
  border: 1px solid rgba(148,163,184,0.2);
}
.ss-time-window.active { background: #f59e0b; color: #0a0e14; border-color: #f59e0b; }
.ss-time-window.warning { background: #ef4444; color: #0a0e14; border-color: #ef4444; }

/* EMSA Items */
.ss-emsa-item { padding: 14px; }
.ss-emsa-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.ss-emsa-title { font-family: 'Bricolage Grotesque', sans-serif; font-size: 15px; font-weight: 600; }
.ss-emsa-instr { font-size: 11px; color: #64748b; margin-top: 2px; }
.ss-emsa-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ss-score-btn {
  font-family: 'Bricolage Grotesque', sans-serif;
  padding: 10px;
  border-radius: 8px;
  border: 1.5px solid rgba(148,163,184,0.2);
  background: transparent;
  color: #94a3b8;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.ss-score-btn.active.normal { border-color: #10b981; background: rgba(16,185,129,0.12); color: #10b981; }
.ss-score-btn.active.abnormal { border-color: #f59e0b; background: rgba(245,158,11,0.12); color: #f59e0b; }
.ss-feedback { margin-top: 10px; font-size: 12px; }
.ss-feedback.correct { color: #10b981; }
.ss-feedback.wrong { color: #ef4444; }

/* Treatment / Action Rows */
.ss-action-row {
  width: 100%;
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 14px; margin-bottom: 8px;
  background: rgba(15,23,42,0.5);
  border: 1px solid rgba(148,163,184,0.15);
  border-radius: 10px;
  text-align: left;
  color: #e2e8f0;
  transition: all 0.15s ease;
}
.ss-action-row.selected.correct { background: rgba(16,185,129,0.1); border-color: #10b981; }
.ss-action-row.selected.wrong { background: rgba(239,68,68,0.1); border-color: #ef4444; }
.ss-check {
  width: 20px; height: 20px;
  border-radius: 5px;
  border: 1.5px solid #475569;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 1px;
  background: transparent;
}
.ss-action-row.selected.correct .ss-check { background: #10b981; border-color: #10b981; }
.ss-action-row.selected.wrong .ss-check { background: #ef4444; border-color: #ef4444; }
.ss-action-label { font-size: 14px; font-weight: 500; }
.ss-action-note { font-size: 11px; color: #64748b; margin-top: 3px; }
.ss-action-pitfall { font-size: 11px; color: #fca5a5; margin-top: 3px; }

/* Transport options */
.ss-transport-btn {
  width: 100%;
  display: flex; align-items: flex-start; gap: 14px;
  padding: 16px; margin-bottom: 10px;
  background: rgba(15,23,42,0.5);
  border: 1.5px solid rgba(148,163,184,0.15);
  border-radius: 12px;
  text-align: left;
  color: #e2e8f0;
}
.ss-transport-btn.chosen-red { background: rgba(239,68,68,0.12); border-color: #ef4444; }
.ss-transport-btn.chosen-amber { background: rgba(245,158,11,0.12); border-color: #f59e0b; }
.ss-transport-btn.chosen-gray { background: rgba(100,116,139,0.12); border-color: #64748b; }
.ss-transport-btn.chosen-cyan { background: rgba(6,182,212,0.12); border-color: #06b6d4; }

/* Debrief */
.ss-debrief-icon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 60px; height: 60px;
  border-radius: 16px;
  margin-bottom: 12px;
}
.ss-debrief-icon.win { background: linear-gradient(135deg, #10b981, #059669); }
.ss-debrief-icon.review { background: linear-gradient(135deg, #f59e0b, #ef4444); }
.ss-perf-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13px; margin-bottom: 8px; }
.ss-perf-row.ok { color: #cbd5e1; }
.ss-perf-row.fail { color: #fca5a5; }

/* Utility */
.ss-grid-gap-8 { display: grid; gap: 8px; }
.ss-flex-center { display: flex; align-items: center; justify-content: center; gap: 10px; }
.ss-text-center { text-align: center; }
.ss-mb-16 { margin-bottom: 16px; }
.ss-mb-12 { margin-bottom: 12px; }
.ss-mb-20 { margin-bottom: 20px; }
.ss-mt-8 { margin-top: 8px; }
.ss-text-muted { color: #94a3b8; }
.ss-text-dim { color: #64748b; }

/* Iframe-friendly: prevent overflow */
@media (max-width: 480px) {
  .ss-container { padding: 12px; }
  .ss-hero-title { font-size: 26px; }
}
</style>

  const ALL_ACTIONS = [
    { id: 'monitor', label: 'Place on cardiac monitor', correct: true, levels: ['I', 'P', 'C'], note: 'I/P/C scope.' },
    { id: 'iv', label: 'Establish large-bore IV access', correct: true, levels: ['A', 'I', 'P', 'C'], note: 'A/I/P/C scope.' },
    { id: 'fluid', label: 'NS 500 mL crystalloid bolus', correct: true, levels: ['A', 'I', 'P', 'C'], note: 'Hold if signs of CHF / volume overload.' },
    { id: 'checklist', label: 'Complete Thrombolytic Checklist', correct: true, levels: ['E', 'A', 'I', 'P', 'C'], note: 'Required for all stroke pts.' },
    { id: 'supine', label: 'Position supine if tolerated', correct: true, levels: ['E', 'A', 'I', 'P', 'C'] },
    { id: 'npo', label: 'Keep NPO (nothing by mouth)', correct: true, levels: ['E', 'A', 'I', 'P', 'C'] },
    { id: 'atcc', label: 'Notify ATCC — enter stroke system', correct: true, levels: ['E', 'A', 'I', 'P', 'C'], note: 'As early as possible.' },

    { id: 'oralAsa', label: 'Give aspirin 324 mg PO', correct: false, levels: ['E', 'A', 'I', 'P', 'C'], pitfall: "NPO. Don't give anything by mouth — and we can't rule out hemorrhagic in the field." },
    { id: 'delay', label: 'Wait for symptoms to improve on scene', correct: false, levels: ['E', 'A', 'I', 'P', 'C'], pitfall: 'Time is brain. Load and go.' },

  /* ============================================================
     STATE
     ============================================================ */
  const state = {
    screen: 'intro',
    provider: null,
    caseQueue: [],
    caseIdx: 0,
    emsaScored: {},
    bgChecked: false,
    treatments: [],
    transport: null,
    totalScore: 0,
    totalMax: 0,
  };

  /* ============================================================
     HELPERS
     ============================================================ */
  const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const formatLKN = (min) => {
    if (min < 60) return `${min} min`;
    const h = Math.floor(min / 60);
    const m = min % 60;
    return m ? `${h} hr ${m} min` : `${h} hr`;
  };

  const destLabel = (id) => ({
    'thrombectomy': 'Comprehensive / Thrombectomy Center',
    'stroke-ready': 'Primary Stroke-Ready Center',
    'closest': 'Closest Facility',
    'treat-mimic': 'Treat mimic & reassess',
  }[id] || id);

  const scoreCase = () => {
    const c = state.caseQueue[state.caseIdx];
    let pts = 0, max = 0;
    Object.entries(c.emsa).forEach(([k, truth]) => {
      max += 1;
      const u = state.emsaScored[k];
      if ((truth === 1 && u === 'abnormal') || (truth === 0 && u === 'normal')) pts += 1;
    });
    max += 2; if (state.bgChecked) pts += 2;
    ['checklist','atcc','historian','supine','npo'].forEach(id => { max += 1; if (state.treatments.includes(id)) pts += 1; });
    ['iv','fluid','monitor'].forEach(id => { max += 1; if (state.treatments.includes(id)) pts += 1; });
    state.treatments.forEach(id => {
      const a = ALL_ACTIONS.find(x => x.id === id);
      if (a && !a.correct) pts -= 2;
    });
    max += 4;
    if (state.transport === c.truth.destination) pts += 4;
    return { points: Math.max(0, pts), max };
  };

  const escapeHtml = (str) => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ============================================================

  function renderStatusBar() {

  function renderHistory() {
    const c = state.caseQueue[state.caseIdx];
    const lknMin = c.history.lknMin;
    const windows = [
      { min: 270, label: '<4.5 hr', sub: 'tPA', active: lknMin <= 270 },

  function renderEMSA() {
    const c = state.caseQueue[state.caseIdx];
    const items = [
      { id: 'gaze', icon: 'eye', label: 'Horizontal Gaze', instr: 'Ask pt to follow your finger left to right with eyes' },
      { id: 'face', icon: 'smile', label: 'Facial Weakness', instr: 'Ask pt to show teeth or smile' },
      { id: 'arm', icon: 'hand', label: 'Arm Drift', instr: 'Hold both arms out, palms up, 10 sec, eyes closed' },
      { id: 'leg', icon: 'footprints', label: 'Leg Weakness', instr: 'Lift each leg for 5 seconds' },
      { id: 'naming', icon: 'messageSquare', label: 'Naming', instr: 'Ask pt to name your watch or pen' },
      { id: 'repetition', icon: 'mic', label: 'Repetition', instr: '"They heard him speak on the radio last night"' },
    ];
    const total = items.reduce((s, i) => s + (state.emsaScored[i.id] === 'abnormal' ? 1 : 0), 0);
    const allScored = items.every(i => state.emsaScored[i.id] !== undefined);
    const remaining = items.filter(i => state.emsaScored[i.id] === undefined).length;

    return `
      <div class="ss-screen">
        <h2 class="ss-display" style="font-size:22px;margin-bottom:4px;">EMSA Stroke Scale</h2>
        <p class="ss-text-muted" style="font-size:13px;margin-bottom:16px;">
          Tap each finding. ≥4 abnormal = concern for LVO stroke.
        </p>
        ${items.map(item => {
          const s = state.emsaScored[item.id];
          const truth = c.emsa[item.id];
          let feedbackHtml = '';
          if (s !== undefined) {
            const correct = (truth === 1 && s === 'abnormal') || (truth === 0 && s === 'normal');
            let msg = '';
            if (truth === 1) msg = s === 'abnormal' ? '✓ Correct — abnormal finding' : '✗ Missed — pt does show this finding';
            else msg = s === 'normal' ? '✓ Correct — finding is normal' : '✗ Overcalled — this finding is normal';
            feedbackHtml = `<div class="ss-feedback ${correct ? 'correct' : 'wrong'}">${msg}</div>`;
          }
          return `
            <div class="ss-card ss-emsa-item">
              <div class="ss-emsa-header">
                ${ICON(item.icon, 18, '#94a3b8')}
                <div style="flex:1;">
                  <div class="ss-emsa-title">${item.label}</div>
                  <div class="ss-emsa-instr">${escapeHtml(item.instr)}</div>
                </div>
              </div>
              <div class="ss-emsa-choices">
                <button class="ss-score-btn ${s === 'normal' ? 'active normal' : ''}" data-action="emsa-score" data-arg="${item.id}|normal">
                  ${s === 'normal' && truth === 0 ? ICON('checkCircle', 14, '#10b981') : ''}
                  ${s === 'normal' && truth === 1 ? ICON('xCircle', 14, '#ef4444') : ''}
                  Normal
                </button>
                <button class="ss-score-btn ${s === 'abnormal' ? 'active abnormal' : ''}" data-action="emsa-score" data-arg="${item.id}|abnormal">
                  ${s === 'abnormal' && truth === 1 ? ICON('checkCircle', 14, '#10b981') : ''}
                  ${s === 'abnormal' && truth === 0 ? ICON('xCircle', 14, '#ef4444') : ''}
                  Abnormal
                </button>
              </div>
              ${feedbackHtml}
            </div>`;
        }).join('')}
        <div class="ss-card ss-mb-16" style="border-color:${total >= 4 ? '#ef4444' : 'rgba(245,158,11,0.3)'};">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="ss-section-label">Total Score</div>
            ${allScored && total >= 4 ? `<span class="ss-pill" style="background:#ef4444;color:#0a0e14;">LVO concern</span>` : ''}
          </div>
          <div class="ss-mono" style="font-size:36px;font-weight:700;color:${total >= 4 ? '#ef4444' : '#f59e0b'};">
            ${total} <span style="color:#64748b;font-size:20px;">/ 6</span>
          </div>
        </div>
        <button class="ss-btn ss-btn-primary" data-action="next-screen" data-arg="treatment" ${allScored ? '' : 'disabled'}>
          ${ICON('arrowRight', 17)} ${allScored ? 'Continue to Treatment' : `Assess all 6 items (${remaining} left)`}
        </button>
      </div>`;
  }

  function renderTreatment() {
    const c = state.caseQueue[state.caseIdx];
    const provider = state.provider;
    const available = ALL_ACTIONS.filter(a => canDo(provider, a.levels));

    const bgCard = !state.bgChecked
      ? `<div class="ss-card">
           <div class="ss-section-label">${ICON('droplet', 12)} Blood Glucose</div>
           <button class="ss-btn ss-btn-info" data-action="check-bg">${ICON('droplet', 17)} Check Blood Glucose</button>
         </div>`
      : `<div class="ss-card" style="border-color:${c.bg < 70 ? '#ef4444' : 'rgba(16,185,129,0.4)'};">
           <div class="ss-section-label">${ICON('droplet', 12)} Blood Glucose</div>
           <div class="ss-mono" style="font-size:28px;font-weight:700;color:${c.bg < 70 ? '#ef4444' : '#10b981'};">
             ${c.bg} <span style="font-size:14px;color:#64748b;">mg/dL</span>
           </div>
           ${c.bg < 70 ? `
             <div style="margin-top:8px;padding:10px;background:rgba(239,68,68,0.1);border-radius:8px;font-size:12px;color:#fca5a5;">
               <strong>HYPOGLYCEMIA</strong> — treat per Hypoglycemia Protocol first. This may be a stroke mimic. Reassess neuro after correction.
             </div>` : ''}
         </div>`;

    return `
      <div class="ss-screen">
        <h2 class="ss-display" style="font-size:22px;margin-bottom:4px;">Treatment</h2>
        <p class="ss-text-muted" style="font-size:13px;margin-bottom:16px;">
          Select actions appropriate for ${PROVIDERS[provider].name}. Wrong choices cost points.
        </p>
        ${bgCard}
        <div style="margin-top:12px;margin-bottom:12px;">
          ${available.map(a => {
            const selected = state.treatments.includes(a.id);
            const klass = selected ? `selected ${a.correct ? 'correct' : 'wrong'}` : '';
            return `
              <button class="ss-action-row ${klass}" data-action="toggle-treatment" data-arg="${a.id}">
                <div class="ss-check">
                  ${selected && a.correct ? ICON('checkCircle', 14, '#0a0e14') : ''}
                  ${selected && !a.correct ? ICON('xCircle', 14, '#fff') : ''}
                </div>
                <div style="flex:1;">
                  <div class="ss-action-label">${escapeHtml(a.label)}</div>
                  ${selected && a.note ? `<div class="ss-action-note">${escapeHtml(a.note)}</div>` : ''}
                  ${selected && a.pitfall ? `<div class="ss-action-pitfall">⚠ ${escapeHtml(a.pitfall)}</div>` : ''}
                </div>
              </button>`;
          }).join('')}
        </div>
        <button class="ss-btn ss-btn-primary" data-action="next-screen" data-arg="transport" ${state.bgChecked ? '' : 'disabled'}>
          ${ICON('arrowRight', 17)} ${state.bgChecked ? 'Make Transport Decision' : 'Check BG first'}
        </button>
      </div>`;
  }

  function renderTransport() {
    const options = [
      { id: 'thrombectomy', label: 'Comprehensive / Thrombectomy Center', sub: 'Neurosurg, neuro-IR, ICU', icon: 'hospital', color: '#ef4444', chosenClass: 'chosen-red', note: 'For EMSA ≥4 (LVO concern) within 24 hr LKN' },
      { id: 'stroke-ready', label: 'Primary Stroke-Ready Center', sub: 'tPA capable, CT, neurology', icon: 'hospital', color: '#f59e0b', chosenClass: 'chosen-amber', note: 'For positive EMSA without LVO, or LVO unavailable' },
      { id: 'closest', label: 'Closest Facility', sub: 'ED only', icon: 'hospital', color: '#64748b', chosenClass: 'chosen-gray', note: 'Only if airway loss, hemodynamic instability, or uncontrolled bleeding' },
      { id: 'treat-mimic', label: 'Treat & Reassess (stroke mimic)', sub: 'If BG corrected or other cause identified', icon: 'shield', color: '#06b6d4', chosenClass: 'chosen-cyan', note: 'If mimic resolves, may downgrade. If persists, enter stroke system.' },
    ];

    return `
      <div class="ss-screen">
        <h2 class="ss-display" style="font-size:22px;margin-bottom:4px;">Transport Decision</h2>
        <p class="ss-text-muted" style="font-size:13px;margin-bottom:16px;">
          Notify ATCC of your decision and any EMSP discretion entry.
        </p>
        ${options.map(opt => {
          const isChosen = state.transport === opt.id;
          return `
            <button class="ss-transport-btn ${isChosen ? opt.chosenClass : ''}" data-action="choose-transport" data-arg="${opt.id}">
              ${ICON(opt.icon, 20, isChosen ? opt.color : '#64748b')}
              <div style="flex:1;">
                <div class="ss-display" style="font-size:15px;font-weight:600;">${escapeHtml(opt.label)}</div>
                <div style="font-size:11px;color:#64748b;margin-top:2px;">${escapeHtml(opt.sub)}</div>
                <div style="font-size:11px;color:#94a3b8;margin-top:6px;font-style:italic;">${escapeHtml(opt.note)}</div>
              </div>
            </button>`;
        }).join('')}
        <button class="ss-btn ss-btn-primary" data-action="finish-case" ${state.transport ? '' : 'disabled'}>
          ${ICON('siren', 17)} Confirm Transport & Notify ATCC
        </button>
      </div>`;
  }

  function renderDebrief() {
    const c = state.caseQueue[state.caseIdx];
    const truth = c.truth;
    const correctDest = state.transport === truth.destination;
    const emsaTotal = Object.values(c.emsa).reduce((a, b) => a + b, 0);
    const userEmsaTotal = Object.entries(state.emsaScored).filter(([k, v]) => v === 'abnormal' && c.emsa[k] === 1).length;
    const wrongActions = state.treatments.filter(id => !ALL_ACTIONS.find(a => a.id === id)?.correct);
    const isLast = state.caseIdx + 1 >= state.caseQueue.length;

    const perfRows = [
      { ok: userEmsaTotal === emsaTotal, label: `EMSA assessment: ${userEmsaTotal}/${emsaTotal} abnormal findings identified` },
      { ok: state.bgChecked, label: state.bgChecked ? 'Blood glucose obtained' : 'Did not check blood glucose' },
      { ok: state.treatments.includes('checklist'), label: state.treatments.includes('checklist') ? 'Thrombolytic Checklist completed' : 'Missed: Thrombolytic Checklist' },
      { ok: state.treatments.includes('atcc'), label: state.treatments.includes('atcc') ? 'ATCC notified — stroke system entry' : 'Missed: ATCC notification' },
      { ok: correctDest, label: `Transport: ${correctDest ? 'Correct destination' : 'Incorrect — should have been ' + destLabel(truth.destination)}` },
    ];
    if (wrongActions.length > 0) {
      perfRows.push({ ok: false, label: `Selected ${wrongActions.length} contraindicated action(s)` });
    }

    return `
      <div class="ss-screen">
        <div class="ss-text-center ss-mb-20">
          <div class="ss-debrief-icon ${correctDest ? 'win' : 'review'}">
            ${correctDest ? ICON('award', 28, '#0a0e14') : ICON('alertTriangle', 28, '#0a0e14')}
          </div>
          <h2 class="ss-display" style="font-size:22px;">
            ${correctDest ? 'Case Complete' : 'Case Complete — Review'}
          </h2>
          <div class="ss-mono" style="font-size:11px;color:#64748b;margin-top:6px;letter-spacing:0.1em;">
            ${escapeHtml(c.title.toUpperCase())}
          </div>
        </div>
        <div class="ss-card ss-accent-amber">
          <div class="ss-section-label">${ICON('brain', 12)} True Diagnosis</div>
          <div class="ss-display" style="font-size:18px;font-weight:600;margin-bottom:8px;">
            ${escapeHtml(truth.diagnosis)}
          </div>
          <div style="font-size:13px;color:#cbd5e1;line-height:1.6;">${escapeHtml(truth.reasoning)}</div>
        </div>
        <div class="ss-card">
          <div class="ss-section-label">${ICON('activity', 12)} Your Performance</div>
          <div style="margin-top:8px;">
            ${perfRows.map(r => `
              <div class="ss-perf-row ${r.ok ? 'ok' : 'fail'}">
                ${ICON(r.ok ? 'checkCircle' : 'xCircle', 16, r.ok ? '#10b981' : '#ef4444')}
                <div>${escapeHtml(r.label)}</div>
              </div>`).join('')}
          </div>
        </div>
        <div class="ss-card ss-accent-cyan ss-mb-16">
          <div class="ss-section-label">${ICON('zap', 12)} Key Teaching Points</div>
          <ul style="margin-top:8px;font-size:13px;line-height:1.7;color:#cbd5e1;">
            ${truth.teaching.map(t => `<li>${escapeHtml(t)}</li>`).join('')}
          </ul>
        </div>
        <button class="ss-btn ss-btn-primary" data-action="next-case">
          ${ICON(isLast ? 'refreshCw' : 'arrowRight', 17)} ${isLast ? 'Restart Shift' : 'Next Call'}
        </button>
      </div>`;
  }

  /* ============================================================
     MAIN RENDER
     ============================================================ */
  function render() {
    const root = document.getElementById('stroke-sim-root');
    if (!root) return;
    let html = renderStatusBar() + '<div class="ss-container">';
    switch (state.screen) {
      case 'intro': html += renderIntro(); break;
      case 'provider': html += renderProviderPicker(); break;
      case 'dispatch': html += renderDispatch(); break;
      case 'primary': html += renderPrimary(); break;
      case 'history': html += renderHistory(); break;
      case 'emsa': html += renderEMSA(); break;
      case 'treatment': html += renderTreatment(); break;
      case 'transport': html += renderTransport(); break;
      case 'debrief': html += renderDebrief(); break;
    }
    html += '</div>';
    root.innerHTML = html;
    // Scroll to top on screen change for iframe contexts
    if (root.scrollTop !== undefined) root.scrollTop = 0;
  }

  /* ============================================================
     EVENT HANDLING (delegated)
     ============================================================ */
  document.addEventListener('click', (e) => {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    const arg = target.dataset.arg;

    switch (action) {
      case 'start':
        state.screen = 'provider';
        render();
        break;
      case 'pick-provider':
        state.provider = arg;
        state.caseQueue = shuffle(CASES);
        state.caseIdx = 0;
        state.totalScore = 0;
        state.totalMax = 0;
        resetCaseState();
        state.screen = 'dispatch';
        render();
        break;
      case 'next-screen':
        state.screen = arg;
        render();
        break;
      case 'emsa-score': {
        const [id, val] = arg.split('|');
        state.emsaScored[id] = val;
        render();
        break;
      }
      case 'check-bg':
        state.bgChecked = true;
        render();
        break;
      case 'toggle-treatment':
        if (state.treatments.includes(arg)) {
          state.treatments = state.treatments.filter(x => x !== arg);
        } else {
          state.treatments.push(arg);
        }
        render();
        break;
      case 'choose-transport':
        state.transport = arg;
        render();
        break;
      case 'finish-case': {
        const { points, max } = scoreCase();
        state.totalScore += points;
        state.totalMax += max;
        state.screen = 'debrief';
        render();
        break;
      }
      case 'next-case':
        if (state.caseIdx + 1 >= state.caseQueue.length) {
          state.caseQueue = shuffle(CASES);
          state.caseIdx = 0;
          state.totalScore = 0;
          state.totalMax = 0;
        } else {
          state.caseIdx += 1;
        }
        resetCaseState();
        state.screen = 'dispatch';
        render();
        break;
    }
  });

  function resetCaseState() {
    state.emsaScored = {};
    state.bgChecked = false;
    state.treatments = [];
    state.transport = null;
  }

  /* ============================================================
     INIT
     ============================================================ */
  state.caseQueue = shuffle(CASES);
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
